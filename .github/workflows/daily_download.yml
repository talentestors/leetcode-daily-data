name: Daily Download

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-download
  cancel-in-progress: false

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run download.py
        run: uv run main.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "talentestors"
          git config --local user.email "355155100+talentestors@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily.json $(date -u +%FT%TZ)"
            git push
          fi
